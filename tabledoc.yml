$schema: https://tabledoc.queria.io/schemas/dataset/v1.json
name: area_stats
title: 地域ごとの指標
description: |-
  町丁目・市区町村などの地域ごとの指標です。地点の値を地域にまとめたものを収録しています。

  出典：「不動産情報ライブラリ」（国土交通省）、「国勢調査 町丁・字等別境界データ」（総務省統計局）、「アドレス・ベース・レジストリ」（デジタル庁）、「都道府県労働局所在地一覧」（厚生労働省）。Queria が加工したものです。
image: cover.png
topics:
  - 地域
  - 町丁目
  - 小地域
  - 地価
  - ハローワーク
homepage: https://github.com/queria-io/dataset-area-stats
language: ja
licenses:
  - JP-GOV-STD-2.0
  - JP-DIGITAL-ADDRESS-BR

sources:
  - id: reinfolib
    title: 不動産情報ライブラリ（国土交通省）
    path: https://www.reinfolib.mlit.go.jp/
  - id: gis
    title: 国勢調査 町丁・字等別境界データ（総務省統計局）
    path: https://www.e-stat.go.jp/gis
  - id: dataset
    title: アドレス・ベース・レジストリ（デジタル庁）
    path: https://dataset.address-br.digital.go.jp/
  - id: roudoukyoku
    title: 都道府県労働局（労働基準監督署、公共職業安定所）所在地一覧（厚生労働省）
    path: https://www.mhlw.go.jp/kouseiroudoushou/shozaiannai/roudoukyoku/index.html

contributors:
  - id: mlit
    title: 国土交通省
    path: https://www.mlit.go.jp/
    roles: [rightsHolder]
  - id: stat
    title: 総務省統計局
    path: https://www.stat.go.jp/
    roles: [rightsHolder]
  - id: digital
    title: デジタル庁
    path: https://www.digital.go.jp/
    roles: [rightsHolder]
  - id: mhlw
    title: 厚生労働省
    path: https://www.mhlw.go.jp/
    roles: [rightsHolder]

spatial_coverage: [JP]
update_frequency: monthly
schemas:
  - name: land_price
    title: 地価
  - name: hellowork
    title: ハローワーク

synonyms: [地域統計, エリア指標, 町丁目別 地価, 地価 相場]
