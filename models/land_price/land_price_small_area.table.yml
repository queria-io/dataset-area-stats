schema: land_price
name: small_area
title: 町丁目別の地価
description: |-
  町丁目ごとの地価の目安です。1 行が国勢調査の小地域 1 つの 1 年です。

  - 値は町（key_code の先頭 9 桁）ごとにまとめていて、同じ町の丁目には同じ値が入ります
  - 取引の値はその年までの 3 年分です。trade_count を町をまたいで合計すると取引の数より多くなります
  - 件数が少ない町の値は目安になりません。land_point_count と trade_count と一緒に見てください
sources:
  - path: https://www.reinfolib.mlit.go.jp/
  - path: https://www.e-stat.go.jp/gis
fields:
  - name: key_code
    title: 小地域コード
    description: e_stat の境界・国勢調査のテーブルと同じ
    extensions: { queria: { semantic: { role: entity, name: small_area } } }
  - name: prefecture_code
    title: 都道府県コード
    extensions: { queria: { semantic: { role: entity, name: prefecture } } }
  - name: city_code
    title: 市区町村コード
    extensions: { queria: { semantic: { role: entity, name: city } } }
  - name: town_code
    title: 町コード
    description: key_code の先頭 9 桁。値はこの単位でまとめています
  - name: area_name
    title: 町丁目名
  - name: year
    title: 年
    description: 地価公示・地価調査は価格時点年、取引は取引年
  - name: land_point_count
    title: 地点数
    description: 町の中にある地価公示・地価調査の地点の数
  - name: land_price_median
    title: 地点価格の中央値
    description: 円/㎡。住宅地・商業地などを合わせた中央値
  - name: land_change_rate_median
    title: 対前年変動率の中央値
    description: '%'
  - name: residential_point_count
    title: 住宅地の地点数
  - name: residential_price_median
    title: 住宅地の価格の中央値
    description: 円/㎡
  - name: commercial_point_count
    title: 商業地の地点数
  - name: commercial_price_median
    title: 商業地の価格の中央値
    description: 円/㎡
  - name: trade_count
    title: 土地の取引件数
    description: その年までの 3 年分。宅地(土地) の取引だけ
  - name: trade_unit_price_median
    title: 土地の取引の㎡単価の中央値
    description: 円/㎡。その年までの 3 年分
